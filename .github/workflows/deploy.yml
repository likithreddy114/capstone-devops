
name: React App CI/CD to Amazon ECR and ECS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build -t capstone-devops-website:latest ./sample-react-app

      - name: Tag Docker image
        run: |
          docker tag capstone-devops-website:latest \
            478122456193.dkr.ecr.ap-south-1.amazonaws.com/capstone-devops-website:latest

      - name: Push image to Amazon ECR
        run: |
          docker push 478122456193.dkr.ecr.ap-south-1.amazonaws.com/capstone-devops-website:latest

      - name: Deploy updated image to ECS
        run: |
          aws ecs update-service \
            --cluster capstone-devops-cluster \
            --service capstone-devops-service \
            --force-new-deployment \
            --region ap-south-1

      - name: Wait for ECS deployment
        run: |
          aws ecs wait services-stable \
            --cluster capstone-devops-cluster \
            --services capstone-devops-service \
            --region ap-south-1
