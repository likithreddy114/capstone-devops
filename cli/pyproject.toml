[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deploy-tool"
version = "0.1.0"
description = "A reusable website deployment CLI for AWS S3 and ECS Fargate"
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.34"
]

[project.scripts]
deploy-tool = "deploy_tool.main:main"